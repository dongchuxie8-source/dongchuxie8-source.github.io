experience:
  - role: Junior Research Assistant (Full-time)
    org: HKUST Scientific AGI Lab, Department of Chemical and Biological Engineering
    start: 2026-09-14
    summary: |
      Conducting AI for Science research and training foundation models for
      science. Designing and implementing continued pre-training, acquiring and
      processing multimodal molecular, protein, material, RNA, and DNA data, and
      developing tokenization methods for each modality. Supervised by
      [Professor Zaixi Zhang](https://zaixizhang.github.io/).
  - role: Research Intern (Part-time)
    org: A*STAR Centre for Frontier AI Research (CFAR), Singapore
    start: 2025-11-15
    end: 2026-07-31
    summary: |
      Worked on two projects under the supervision of
      [Professor Ivor Tsang](https://www.a-star.edu.sg/cfar/about-cfar/management/prof-ivor-tsang):

      - **Domain-Explained Residuals (submitted to AAAI 2027):** Designed robust
        offline-to-online reinforcement learning algorithms for dynamics shifts
        and severe data corruption.
      - **HSSR-LM (submitted to AAAI 2027):** Developed bidirectional translation
        between porous crystal structures and natural language, proposed the
        Hierarchical Structure Sequence Representation, and curated a
        multi-granularity dataset of 8,000 samples.
  - role: Research Training Student (Full-time)
    org: TU Dortmund University, Germany
    start: 2025-05-31
    end: 2025-07-31
    summary: |
      Completed a Chemical Engineering research project on optimization-based
      control of a continuous stirred-tank reactor. Developed, tested, and
      analyzed a neural-network approximate model predictive controller under
      simulated operational constraints, producing a functioning prototype and
      presenting the final results.
  - role: Research Intern (Part-time)
    org: Urban Governance and Design Thrust, HKUST(GZ)
    start: 2025-04-15
    end: 2025-08-15
    summary: |
      Synthesized literature on computational sociology and urban governance,
      cleaned and integrated multi-source datasets, and coauthored the manuscript.
  - role: Research Intern (Part-time)
    org: Human Language Technology Lab, CUHKSZ
    start: 2025-01-01
    end: 2026-01-31
    summary: |
      Worked under the supervision of
      [Professor Haizhou Li](https://www.colips.org/~eleliha/) on two papers:

      - **Hanfu-Bench (EMNLP 2025):** Co-developed a multimodal cultural-evolution
        benchmark with 1,192 expert-annotated images spanning five dynasties.
      - **Emo-LiPO (IJCAI 2026):** Proposed listwise preference optimization for
        fine-grained emotion-intensity control in TTS and constructed ESD-plus.

