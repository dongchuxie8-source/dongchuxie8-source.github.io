bio: |
  I am a fourth-year undergraduate student majoring in Electronic and Computer
  Engineering at The Chinese University of Hong Kong, Shenzhen (CUHKSZ). I am
  currently a Research Assistant at the HKUST Scientific AGI Lab, under the
  supervision of [Professor Zaixi Zhang](https://zaixizhang.github.io/). Prior
  to this, I worked as a research intern at A*STAR CFAR under the supervision
  of [Professor Ivor Tsang](https://www.a-star.edu.sg/cfar/about-cfar/management/prof-ivor-tsang)
  and at the CUHKSZ HLT Lab under the supervision of
  [Professor Haizhou Li](https://www.colips.org/~eleliha/).

  My research interests center on AI for Science, particularly foundation model
  pre-training across multi-scale biological and material tokens. I am also
  interested in robust reinforcement learning, world models, and computational
  neuroscience.

  I enjoy taking on new challenges in AI4S. It allows me to learn, grow, and
  enhance my research abilities. I also love working with different researchers
  to spark creativity and new perspectives.

  If you find my research intriguing or if it fits your project's needs, please
  feel free to reach out to me at [kedcxie@ust.hk](mailto:kedcxie@ust.hk) (HKUST)
  or [dongchuxie@cuhk.edu.cn](mailto:dongchuxie@cuhk.edu.cn) (CUHKSZ).

